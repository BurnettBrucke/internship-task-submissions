<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

<h1>Add Student</h1>

{% if messages %}
    {% for message in messages %}
        <p style="color:green;">
            {{ message }}
        </p>
    {% endfor %}
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Add Student
    </button>

</form>

<br>

<a href="{% url 'add_student' %}">
    Back to Student List
</a>

</body>
</html>
