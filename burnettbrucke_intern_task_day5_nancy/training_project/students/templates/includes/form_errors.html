{% if form.non_field_errors %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

{% if form.errors and not form.non_field_errors %}
    <div class="alert alert-danger">
        Please fix the highlighted field{{ form.errors|length|pluralize }} below.
    </div>
{% endif %}
