{% extends "base.html" %}
{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <i class="bi bi-envelope-check display-4 text-success"></i>
                <h5 class="mt-3">Check your email</h5>
                <p class="text-muted">If an account exists with that email address, we've sent a link to reset your password. It may take a few minutes to arrive.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
