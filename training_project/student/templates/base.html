<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Student Management System
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #5f4c4c;
        }

        nav {
            background-color: #2f2626;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 17px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            background: #c5aa6a;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        input,
        select {
            padding: 8px;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <!-- Common Navbar -->
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'student_list' %}">Students</a>
        <a href="{% url 'add_student' %}">Add Student</a>
    </nav>


    <!-- Page-specific content -->
    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
