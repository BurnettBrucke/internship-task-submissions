{% extends 'base.html' %}
{% block title %}Password Reset Complete — Training Portal{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm text-center">
    <div class="card-body py-5">
      <div class="display-1 mb-3">✅</div>
      <h2 class="fw-bold">Password Reset Complete!</h2>
      <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Go to Login</a>
    </div>
  </div>
</div>
{% endblock %}
