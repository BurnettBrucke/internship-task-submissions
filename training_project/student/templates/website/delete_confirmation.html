{% extends "base.html" %}

{% block content %}

<h1>Delete Student</h1>

<p>
    Are you sure you want to delete
    <strong>{{ student.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit"style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 25px; width: 78px; height: 32px; background: #ef4444; color: white; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: sans-serif; text-decoration: none; border: none; cursor: pointer;">
        <svg xmlns="http://w3.org" viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        Yes, Delete
    </button>

    <a href="{% url 'student_list' %}">
        Cancel
    </a>
</form>

{% endblock %}
