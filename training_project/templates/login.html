{% extends "base.html" %}

{% block title %}Login | Student Training Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <!-- Clean Login Card -->
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h3 class="fw-bold text-dark mb-4 text-center">Login</h3>
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-medium text-secondary">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                </div>
                
                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-medium text-secondary">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                
                <!-- Remember Me Checkbox -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me">
                    <label class="form-check-label text-secondary small" for="remember_me">
                        Remember Me
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
            
            <hr class="text-muted opacity-25">
            
            <!-- Footer Links -->
            <div class="d-flex justify-content-between align-items-center small mt-2">
                <a href="{% url 'password_reset' %}" class="text-decoration-none text-muted">Forgot Password?</a>
                <a href="{% url 'register' %}" class="text-decoration-none text-primary fw-medium">Create an account</a>
            </div>
            
        </div>
        
    </div>
</div>
{% endblock %}
