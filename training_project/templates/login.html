{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username:</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password:</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

{% endblock %}
