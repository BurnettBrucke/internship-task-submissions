
<!DOCTYPE html>
<html>

<head>

<title>

{% block title %}

Student Management

{% endblock %}

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand"
href="{% url 'student_list' %}">

Student Management

</a>

<ul class="navbar-nav ms-auto">

{% if user.is_authenticated %}

<li class="nav-item">

<span class="navbar-text text-white me-3">

Welcome, {{ user.username }}

</span>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'logout' %}">

Logout

</a>

</li>

{% else %}

<li class="nav-item">

<a class="nav-link"
href="{% url 'login' %}">

Login

</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="{% url 'register' %}">

Register

</a>

</li>

{% endif %}

</ul>

</div>

</nav>

<div class="container mt-4">

{% if messages %}

{% for message in messages %}

<div class="alert alert-success">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% block content %}

{% endblock %}

</div>

</body>

</html>
