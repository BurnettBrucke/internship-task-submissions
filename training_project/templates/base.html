{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Student Management
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

    {% block extra_css %}
    {% endblock %}

</head>

    <body class="{% if user.is_authenticated %}role-{{ user.profile.role|lower }}{% else %}role-public{% endif %}">
    {% include "includes/navbar.html" %}

    {% include "includes/messages.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center mt-5 py-3">
        <p class="mb-0">
            &copy; 2026 Student Management System
        </p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("form").forEach(function (form) {
        form.addEventListener("submit", function (event) {
            // Allow the browser to handle validation normally.
            if (!form.checkValidity()) {
                return;
            }

            // Prevent double submission.
            if (form.dataset.submitting === "true") {
                event.preventDefault();
                return;
            }

            form.dataset.submitting = "true";

            const submitButtons = form.querySelectorAll(
                'button[type="submit"], input[type="submit"]'
            );

            submitButtons.forEach(function (button) {
                button.disabled = true;

                // Store original text so we can use it if needed.
                if (button.tagName === "BUTTON") {
                    button.dataset.originalText = button.innerHTML;
                    button.innerHTML = `
                        <span
                            class="spinner-border spinner-border-sm me-1"
                            role="status"
                            aria-hidden="true">
                        </span>
                        Processing...
                    `;
                } else {
                    button.dataset.originalValue = button.value;
                    button.value = "Processing...";
                }
            });
        });
    });
});
</script>

{% block extra_js %}{% endblock %}

</body>

</html>
