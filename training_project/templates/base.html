<!DOCTYPE html>
<html>

<head>

    <title>
        {% block title %}
        Student Management
        {% endblock %}
    </title>

    <style>

    /* Basic page styling */

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #F8F9FA;
        color: #1D3557;
    }


    /* Navigation bar */

    nav {
        background-color: #1D3557;
        padding: 18px 40px;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }


    nav h2 {
        color: white;
        margin: 0;
    }


    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
    }


    nav a:hover {
        color: #E9C46A;
    }


    /* Main content */

    main {
        width: 85%;
        max-width: 1100px;
        margin: 40px auto;
    }


    /* Common card */

    .card {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        border-left: 4px solid #457B9D;
        box-shadow: 0 2px 8px rgba(29, 53, 87, 0.08);
        margin-bottom: 25px;
    }


    /* Buttons */

    .button {
        display: inline-block;
        background-color: #457B9D;
        color: white;
        padding: 10px 18px;
        text-decoration: none;
        border-radius: 5px;
    }


    .button:hover {
        background-color: #1D3557;
    }


    button {
        background-color: #457B9D;
        color: white;
        border: none;
        padding: 11px 20px;
        border-radius: 5px;
        cursor: pointer;
    }


    button:hover {
        background-color: #1D3557;
    }


    /* Student statistics */

    .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
    }


    .stat-card {
        background-color: white;
        padding: 20px;
        flex: 1;
        border-radius: 8px;
        border-top: 4px solid #E9C46A;
        box-shadow: 0 2px 8px rgba(29, 53, 87, 0.08);
    }


    .stat-card h3 {
        margin-top: 0;
    }


    .stat-number {
        font-size: 28px;
        font-weight: bold;
        color: #457B9D;
    }


    /* Table */

    table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
    }


    th,
    td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }


    th {
        background-color: #1D3557;
        color: white;
    }


    tr:hover {
        background-color: #F8F9FA;
    }


    /* Pass / Fail */

    .pass {
        color: #2E7D32;
        font-weight: bold;
    }


    .fail {
        color: #C62828;
        font-weight: bold;
    }


    /* Success message */

    .success {
        background-color: #E9C46A;
        color: #1D3557;
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
    }


    /* Add student form */

    .form-card {
        background-color: white;
        max-width: 600px;
        margin: auto;
        padding: 30px;
        border-radius: 8px;
        border-top: 4px solid #457B9D;
        box-shadow: 0 2px 8px rgba(29, 53, 87, 0.08);
    }


    .form-card h1 {
        margin-top: 0;
        color: #1D3557;
    }


    .form-card input,
    .form-card select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }


    .form-card input:focus,
    .form-card select:focus {
        outline: none;
        border: 2px solid #457B9D;
    }

</style>

</head>


<body>

<nav>

    <h2>Student Management</h2>

    <div>

        <a href="{% url 'home' %}">HOME</a>

        <a href="{% url 'about' %}">ABOUT</a>

        <a href="{% url 'students_list' %}">STUDENTS</a>

        <a href="{% url 'add_students' %}">ADD</a>

    </div>

</nav>



    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
