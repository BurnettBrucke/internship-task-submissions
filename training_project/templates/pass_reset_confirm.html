{% extends "base.html" %}

{% block title %}Set New Password | Student Training Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <!-- Clean Reset Password Card -->
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h3 class="fw-bold text-dark mb-3 text-center">Set New Password</h3>
            
            <p class="text-secondary small text-center mb-4">
                Please enter and confirm your new password below to update your account access.
            </p>
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- Form Wrapper to capture and style Django's raw form fields -->
                <div class="mb-4 d-django-form-fix">
                    {{ form.as_p }}
                </div>
                
                <!-- Unified Theme Primary Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Change Password
                </button>
            </form>
            
        </div>
        
    </div>
</div>

<style>
    /* Injected styles ensuring Django's dynamically generated fields adopt our modern Bootstrap look */
    .d-django-form-fix p label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #6c757d;
        margin-bottom: 0.25rem;
    }
    .d-django-form-fix p input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    .d-django-form-fix p input:focus {
        color: #212529;
        background-color: #fff;
        border-color: #a5b4fc;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
    }
    /* Tiny layout fix for Django password help text tags if present */
    .d-django-form-fix p .helptext {
        display: block;
        font-size: 0.75rem;
        color: #6c757d;
        margin-top: 0.25rem;
    }
</style>
{% endblock %}
