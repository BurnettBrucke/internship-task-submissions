{% extends "base.html" %}

{% block title %}Register | Student Training Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        
        <!-- Clean Registration Card -->
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h3 class="fw-bold text-dark mb-4 text-center">Registration</h3>
            
            <form method="POST">
                {% csrf_token %}
                
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-medium text-secondary">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-medium text-secondary">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-medium text-secondary">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                </div>

                <!-- Confirm Password Input -->
                <div class="mb-3">
                    <label for="confirm_password" class="form-label small fw-medium text-secondary">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
            </form>
            
            <hr class="text-muted opacity-25">
            
            <!-- Footer Link -->
            <div class="text-center small mt-2">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'login' %}" class="text-decoration-none text-primary fw-medium ms-1">Login here</a>
            </div>
            
        </div>
        
    </div>
</div>
{% endblock %}
