{% extends "base.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Register</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
        >

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
        >

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

{% endblock %}
