{% extends "base.html" %}

{% block title %}

{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="text-center">

        <h1 class="display-1 fw-bold">500</h1>

        <h2 class="mb-3">

        <a href="{% url 'home' %}" class="btn btn-primary">
            Go to Home
        </a>

    </div>
</div>

{% endblock %}
