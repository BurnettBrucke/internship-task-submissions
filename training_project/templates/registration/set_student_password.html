{% extends "base.html" %}


{% block title %}
    Set Password
{% endblock %}


{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="mb-3">
                        Set Your Password
                    </h2>

                    <p class="text-muted">
                        Create a password for your student account.
                    </p>


                    <form method="post">

                        {% csrf_token %}

                        {% include "includes/form_errors.html" %}

                        {{ form.as_p }}


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Set Password
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
