{% extends "base.html" %}

{% block title %}
    Reset Email Sent
{% endblock %}


{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm text-center">

                <div class="card-body p-5">

                    <span class="badge bg-success mb-3">
                        Email Sent
                    </span>

                    <h2 class="mb-3">
                        Check Your Email
                    </h2>

                    <p class="text-muted">
                        If an account exists with the email address
                        you entered, a password reset link has been sent.
                    </p>

                    <p class="small text-muted">
                        Please also check your spam or junk folder.
                    </p>


                    <a
                        href="{% url 'login' %}"
                        class="btn btn-primary"
                    >
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
