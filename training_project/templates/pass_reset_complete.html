{% extends "base.html" %}

{% block title %}Password Reset Complete | Student Training Portal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5 text-center">
        
        <!-- Success Confirmation Card -->
        <div class="card border-0 shadow-sm p-4 bg-white">
            <div class="mb-3">
                <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
            </div>
            
            <h3 class="fw-bold text-dark mb-2">Password Changed!</h3>
            
            <p class="text-secondary small mb-4">
                Your password has been reset successfully. You can now log in with your new credentials.
            </p>
            
            <!-- Clear Action Button Alignment -->
            <a href="{% url 'login' %}" class="btn btn-primary w-100">
                Sign In
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
