{% if breadcrumbs %}
<div class="page-breadcrumb" aria-label="breadcrumb">
    <ol class="breadcrumb">
        {% for breadcrumb in breadcrumbs %}
            {% if breadcrumb.url %}
                <li class="breadcrumb-item">
                    <a href="{{ breadcrumb.url }}">
                        {{ breadcrumb.name }}
                    </a>
                </li>
            {% else %}
                <li class="breadcrumb-item active" aria-current="page">
                    {{ breadcrumb.name }}
                </li>
            {% endif %}
        {% endfor %}
    </ol>
</div>
{% endif %}
