<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">

        <li class="breadcrumb-item">
            <a href="{% url 'home' %}" class="text-decoration-none">
                Home
            </a>
        </li>

        {% if breadcrumb_parent %}
            <li class="breadcrumb-item">
                {{ breadcrumb_parent }}
            </li>
        {% endif %}

        {% if breadcrumb_current %}
            <li class="breadcrumb-item active" aria-current="page">
                {{ breadcrumb_current }}
            </li>
        {% endif %}

    </ol>
</nav>
