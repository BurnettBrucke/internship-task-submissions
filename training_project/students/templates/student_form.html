{% extends "base.html" %}

{% block title %}
Student Form
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Student Form</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {% include "includes/form_errors.html" %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Save
                    </button>

                    <a
                        href="{% url 'student_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
