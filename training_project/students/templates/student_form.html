<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>

    <h1>Student Form</h1>

    <!-- Validation Errors -->
    {% if form.errors %}
        <div style="color:red;">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save
        </button>

        <a href="{% url 'student_list' %}">
            <button type="button">
                Cancel
            </button>
        </a>

    </form>

</body>
</html>
