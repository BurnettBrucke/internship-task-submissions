{% extends "base.html" %}

{% block title %}
Student Form
{% endblock %}

{% block content %}

<div class="card shadow mt-4">

    <div class="card-header bg-primary text-white">
        <h3>Student Form</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}
            {% include "includes/form_errors.html" %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Save
            </button>

            <a href="{% url 'student_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
