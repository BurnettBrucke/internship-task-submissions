<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .form-container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary-color);
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Django Forms (as_p) को स्टाइल करने के लिए */
        form p {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 0.95rem;
        }

        /* सभी इनपुट बॉक्स (Text, Email, Number, Date) की स्टाइलिंग */
        form input[type="text"],
        form input[type="number"],
        form input[type="email"],
        form input[type="date"],
        form input, 
        form select, 
        form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        /* इनपुट बॉक्स पर क्लिक (Focus) करने पर */
        form input:focus, 
        form select:focus, 
        form textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
            background-color: #ffffff;
        }

        /* बटन की स्टाइलिंग */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Add Student</h1>

        {% comment %} <form  method="POST">
            {% csrf_token %}

            <label>Name</label><br>
            <input type="text" name="name"><br><br>

            <label>Age</label><br>
            <input type="number" name="age"><br><br>

            <label>Email</label><br>
            <input type="email" name="email"><br><br>

            <label>Course</label><br>
            <input type="text" name="course"><br><br>

            <label>Marks</label><br>
            <input type="number" name="marks"><br><br>

            <label>join_date</label><br>
            <input type="date" name="join_date"><br><br>

            <button type="submit">Save</button>

        </form> {% endcomment %}

        <form method="POST">
            {% csrf_token %}
            {{ forms.as_p }}

            <button type="submit" class="btn-submit">Save Student</button>
            
        </form>
        <a href="{% url 'show_student' %}">
        <button type="submit" class="btn-submit">Show Students</button>
        
</a>
    </div>

</body>
</html>
