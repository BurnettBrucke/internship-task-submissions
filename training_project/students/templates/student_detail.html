<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<body>

    <h1>Student Details</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>ID</th>
            <td>{{ student.id }}</td>
        </tr>

        <tr>
            <th>Name</th>
            <td>{{ student.name }}</td>
        </tr>

        <tr>
            <th>Email</th>
            <td>{{ student.email }}</td>
        </tr>

        <tr>
            <th>Age</th>
            <td>{{ student.age }}</td>
        </tr>

        <tr>
            <th>Course</th>
            <td>{{ student.course }}</td>
        </tr>

        <tr>
            <th>Marks</th>
            <td>{{ student.marks }}</td>
        </tr>

        <tr>
            <th>Join Date</th>
            <td>{{ student.join_date }}</td>
        </tr>

        <tr>
            <th>Status</th>
            <td>{{ student.active_status }}</td>
        </tr>

    </table>

    <br>

    <a href="{% url 'edit_student' student.id %}">
        <button>Edit</button>
    </a>

    <a href="{% url 'delete_student' student.id %}">
        <button>Delete</button>
    </a>

    <a href="{% url 'student_list' %}">
        <button>Back</button>
    </a>

</body>
</html>
