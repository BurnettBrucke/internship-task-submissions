{% extends 'students/base.html' %}

{% block title %}Login - Student Management{% endblock %}

{% block content %}

<style>
    .container {
        min-height: calc(100vh - 70px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
    }

    .login-box {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .login-box h1 {
        text-align: center;
        color: #1f2937;
        margin-bottom: 30px;
    }

    .login-box form {
        display: flex;
        flex-direction: column;
    }

    .login-box label {
        margin-bottom: 6px;
        font-weight: bold;
        color: #374151;
    }

    .login-box input {
        padding: 11px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .login-box input:focus {
        outline: none;
        border-color: #2563eb;
    }

    .login-button {
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        background: #1d4ed8;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        color: #555;
    }

    .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .login-box {
            padding: 30px 20px;
        }
    }
</style>

<div class="container">
    <div class="login-box">

        <h1>Login</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-button">
                Login
            </button>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </div>

    </div>
</div>

{% endblock %}
