{% extends 'base.html' %}

{% block title %}Add User{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-header">
                <h4 class="mb-0">Add User</h4>
            </div>

            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Role</label>

                        <select name="role" class="form-select" required>
                            <option value="">Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="trainer">Trainer</option>
                            <option value="student">Student</option>
                        </select>
                    </div>

                    <button type="submit"
        class="btn btn-primary"
        id="userSubmitBtn">
    <span id="userSubmitText">Create User</span>
    <span id="userSubmitSpinner"
          class="spinner-border spinner-border-sm d-none"
          role="status"
          aria-hidden="true">
    </span>
</button>

                    <a href="{% url 'user_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>

</div>

{% block extra_js %}
<script>
document.querySelector('form').addEventListener('submit', function () {

    const button = document.getElementById('userSubmitBtn');
    const text = document.getElementById('userSubmitText');
    const spinner = document.getElementById('userSubmitSpinner');

    button.disabled = true;
    text.textContent = 'Creating...';
    spinner.classList.remove('d-none');

});
</script>
{% endblock %}
{% endblock %}
