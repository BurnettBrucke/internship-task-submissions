<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background: #1f2937;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Messages */
        .message {
            max-width: 900px;
            margin: 20px auto;
            padding: 12px;
            border-radius: 6px;
            background: #e5e7eb;
            text-align: center;
        }

        /* Page Content */
        .page-content {
            padding: 30px 20px;
        }

        /* Responsive */
        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .navbar a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <h2>Student Management</h2>

        <div>

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'about' %}">About</a>

            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'student_list' %}">Students</a>

                <span style="color: white; margin-left: 20px;">
                    Welcome, {{ user.username }}
                </span>

                <a href="{% url 'logout' %}">Logout</a>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

                <a href="{% url 'register' %}">Register</a>

            {% endif %}

        </div>

    </div>


    <!-- Django Messages -->
    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <!-- Page Content -->
    <div class="page-content">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
