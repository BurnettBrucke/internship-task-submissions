{% extends 'base.html' %}

{% block title %}Add Trainer{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-header">
                <h4 class="mb-0">Add Trainer</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ field.errors }}
                                </div>
                            {% endif %}

                        </div>

                    {% endfor %}

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-primary">
                            Create Trainer
                        </button>

                        <a href="{% url 'trainer_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
