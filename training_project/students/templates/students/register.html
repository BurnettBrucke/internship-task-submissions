{% extends 'students/base.html' %}

{% block title %}Register - Student Management{% endblock %}

{% block content %}

<style>
    .container {
        min-height: calc(100vh - 70px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
    }

    .register-box {
        background: white;
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .register-box h1 {
        text-align: center;
        color: #1f2937;
        margin-bottom: 30px;
    }

    .register-box form {
        display: flex;
        flex-direction: column;
    }

    .register-box label {
        margin-bottom: 6px;
        font-weight: bold;
        color: #374151;
    }

    .register-box input,
    .register-box select {
        padding: 11px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .register-box input:focus,
    .register-box select:focus {
        outline: none;
        border-color: #2563eb;
    }

    .errorlist {
        color: #dc2626;
        font-size: 14px;
        margin: 0 0 12px 0;
        padding-left: 20px;
    }

    .register-button {
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
    }

    .register-button:hover {
        background: #1d4ed8;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #555;
    }

    .login-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .register-box {
            padding: 30px 20px;
        }
    }
</style>

<div class="container">
    <div class="register-box">

        <h1>Register</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {{ field.errors }}
            {% endfor %}

            <button type="submit" class="register-button">
                Register
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>
</div>

{% endblock %}
