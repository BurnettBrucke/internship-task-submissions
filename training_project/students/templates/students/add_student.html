<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }

        .button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button {
            background-color: #222;
            color: white;
        }

        .submit-button:hover {
            background-color: #444;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Add Student</h1>

        <form method="POST">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.errors %}
                        {% for error in field.errors %}
                            <p class="error">{{ error }}</p>
                        {% endfor %}
                    {% endif %}

                </div>

            {% endfor %}

            <button type="submit" class="button submit-button">
                Add Student
            </button>

        </form>

        <a href="{% url 'student_list' %}" class="back-link">
            ← Back to Student List
        </a>

    </div>

</div>

</body>
</html>
