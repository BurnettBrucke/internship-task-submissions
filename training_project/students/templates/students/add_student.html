<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .navbar {
            background-color: #1f2937;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: white;
            margin: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-box {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 30px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .submit-button {
            background-color: #2563eb;
            color: white;
        }

        .submit-button:hover {
            background-color: #1d4ed8;
        }

        .back-button {
            background-color: #e5e7eb;
            color: #374151;
        }

        .back-button:hover {
            background-color: #d1d5db;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .container {
                width: 92%;
                margin: 25px auto;
            }

            .form-box {
                padding: 25px 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <h2>Student Management</h2>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'student_list' %}">Students</a>
        </div>

    </nav>


    <div class="container">

        <div class="form-box">

            <h1>{{ title }}</h1>

            <form method="POST">

                {% csrf_token %}

                {% for field in form %}

                    <div class="form-group">

                        {{ field.label_tag }}

                        {{ field }}

                        {% if field.errors %}
                            {% for error in field.errors %}
                                <p class="error">{{ error }}</p>
                            {% endfor %}
                        {% endif %}

                    </div>

                {% endfor %}


                <div class="button-group">

                    <button
                        type="submit"
                        class="button submit-button">
                        Save Student
                    </button>

                    <a
                        href="{% url 'student_list' %}"
                        class="button back-button">
                        Back to Students
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
