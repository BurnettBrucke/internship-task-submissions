{% extends 'base.html' %}

{% block title %}
    {% if edit_mode %}Edit Course{% else %}Add Course{% endif %}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-header">
                <h4 class="mb-0">
                    {% if edit_mode %}
                        Edit Course
                    {% else %}
                        Add Course
                    {% endif %}
                </h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Course Name
                        </label>

                        <input type="text"
                               name="course_name"
                               class="form-control"
                               value="{{ course.course_name|default:'' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Course Code
                        </label>

                        <input type="text"
                               name="code"
                               class="form-control"
                               value="{{ course.code|default:'' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Duration
                        </label>

                        <input type="text"
                               name="duration"
                               class="form-control"
                               value="{{ course.duration|default:'' }}"
                               required>
                    </div>

                    <div class="form-check mb-4">

                        <input type="checkbox"
                               name="active_status"
                               class="form-check-input"
                               id="active_status"
                               {% if not edit_mode or course.active_status %}
                                   checked
                               {% endif %}>

                        <label class="form-check-label"
                               for="active_status">
                            Active Course
                        </label>

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        {% if edit_mode %}
                            Update Course
                        {% else %}
                            Add Course
                        {% endif %}

                    </button>

                    <a href="{% url 'course_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
