{% extends "base.html" %}

{% block title %}
Password Reset Sent
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="alert alert-success shadow text-center">

            <h3>

                <i class="bi bi-check-circle-fill"></i>

                Reset Link Sent

            </h3>

            <p>

                If the email exists, a password reset link has been sent.

            </p>

            <a href="{% url 'login' %}"
               class="btn btn-success">

                Back to Login

            </a>

        </div>

    </div>

</div>

{% endblock %}
