{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">

                <h3>
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}

                            <div class="text-danger">

                                {{ field.errors }}

                            </div>

                        {% endif %}

                    </div>

                    {% endfor %}

                    <div class="d-grid">

                        <button class="btn btn-primary">

                            Login

                        </button>

                    </div>

                </form>

                <hr>

                <p class="text-center">

                    Don't have an account?

                    <a href="{% url 'register' %}">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
