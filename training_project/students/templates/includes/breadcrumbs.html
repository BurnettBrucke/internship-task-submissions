{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">

        {% for breadcrumb in breadcrumbs %}

            {% if breadcrumb.url %}
                <li class="breadcrumb-item">
                    <a href="{{ breadcrumb.url }}">
                        {{ breadcrumb.label }}
                    </a>
                </li>
            {% else %}
                <li class="breadcrumb-item active" aria-current="page">
                    {{ breadcrumb.label }}
                </li>
            {% endif %}

        {% endfor %}

    </ol>
</nav>
{% endif %}
