{% extends 'base.html' %}

{% block title %}Password Reset Complete - Student Training Portal{% endblock %}

{% block content %}
<div class="row my-5">
    <div class="col-md-6 col-lg-5 mx-auto">
        <div class="card card-custom p-4 shadow-lg text-center">
            <div class="mb-4">
                <i class="fa-solid fa-circle-check text-success fs-1"></i>
            </div>
            <h3 class="fw-bold mb-2 text-white">Password Reset Complete</h3>
            <p class="text-secondary small mb-4">Your password has been successfully reset. You can now log in with your new credentials.</p>
            
            <div class="d-grid">
                <a href="{% url 'login' %}" class="btn btn-primary btn-grad border-0 py-2">
                    Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
