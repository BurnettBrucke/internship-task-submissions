{% extends 'base.html' %}

{% block title %}404 Page Not Found - Student Training Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card card-custom p-5 shadow-lg border-warning-subtle">
            <div class="mb-4">
                <span class="badge bg-warning text-dark fs-5 px-3 py-2 rounded-pill">HTTP 404</span>
            </div>
            <i class="fa-solid fa-compass-drafting text-warning display-1 mb-4"></i>
            <h1 class="fw-bold mb-3">Page Not Found</h1>
            <p class="text-secondary lead mb-4">
                The page or resource you are looking for does not exist or may have been moved.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-primary btn-grad border-0 px-4">
                    <i class="fa-solid fa-house me-2"></i>Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="fa-solid fa-arrow-left me-2"></i>Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
