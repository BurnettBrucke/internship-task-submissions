<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Training Portal{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }
        /* Gradient backdrop blobs */
        .blob {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.1) 0%, rgba(79, 70, 229, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: -1;
            pointer-events: none;
        }
        .blob-2 {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, rgba(124, 58, 237, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: -1;
            pointer-events: none;
        }
        /* Cards styling */
        .card-custom {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .navbar-custom {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
        }
        footer {
            margin-top: auto;
            border-top: 1px solid var(--card-border);
            background: rgba(9, 13, 22, 0.9);
            padding: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        /* Custom buttons styling to ensure consistency */
        .btn-grad {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 500;
        }
        .btn-grad:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="blob"></div>
    <div class="blob-2"></div>

    <!-- Reusable Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Main Content wrapper -->
    <main class="container my-5">
        <!-- Reusable Messages -->
        {% include 'includes/messages.html' %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center text-md-start">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Student Training Portal &bull; Bug Network Private Limited &bull; All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsnZI51L7bR5R5h5aa5xrIEnFkdj13ALeViv932dU86dQRV65/A58223d5012" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
