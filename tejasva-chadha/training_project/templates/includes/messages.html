{% if messages %}
<div class="messages-container">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert" style="border-radius: 12px; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(8px); border-color: rgba(255, 255, 255, 0.1);">
            <div class="d-flex align-items-center">
                {% if message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check text-success me-2 fs-5"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="fa-solid fa-circle-exclamation text-danger me-2 fs-5"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fa-solid fa-triangle-exclamation text-warning me-2 fs-5"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info text-info me-2 fs-5"></i>
                {% endif %}
                <span class="text-white">{{ message }}</span>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
