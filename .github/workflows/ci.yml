name: CI

on:
  push:
    branches:
      - main
      - "burnettbrucke-intern-task-*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AUTH_USERNAME: admin
  AUTH_PASSWORD: ci-test-password
  PROCESSING_SERVICE_TOKEN: change_me_internal_token
  PROCESSING_BASE_URL: http://127.0.0.1:8001
  PROCESSING_TEST_URL: http://127.0.0.1:8001
  PROCESSING_TIMEOUT_SECONDS: "5"
  DATABASE_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5433/jobs_db
  REDIS_URL: redis://127.0.0.1:6379/0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FastAPI_Microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway_service/requirements.txt
          pip install -r processing_service/requirements.txt
          pip install ruff

      - name: Run Ruff
        run: ruff check gateway_service processing_service

      - name: Check formatting
        run: ruff format --check gateway_service processing_service

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FastAPI_Microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway_service/requirements.txt
          pip install -r processing_service/requirements.txt
          pip install pytest pytest-asyncio httpx python-dotenv

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres -d jobs_db; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs redis
          exit 1

      - name: Run database migrations
        run: docker compose run --rm --no-deps processing-service alembic upgrade head

      - name: Start application services
        run: docker compose up -d processing-service worker gateway-service

      - name: Wait for Processing Service
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health; then
              echo "Processing Service is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs processing-service
          exit 1

      - name: Wait for Gateway Service
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "Gateway Service is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs gateway-service
          exit 1

      - name: Run Processing Service tests
        working-directory: FastAPI_Microservices/processing_service
        run: pytest -q tests/test_day8_processing.py

      - name: Run Gateway integration tests
        working-directory: FastAPI_Microservices/gateway_service
        run: pytest -q tests/test_day8_integration.py

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FastAPI_Microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build