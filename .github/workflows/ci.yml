name: Microservices CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PROCESSING_BASE_URL: "http://127.0.0.1:8001"
      INTERNAL_SERVICE_TOKEN: "test-internal-token"
      JWT_SECRET_KEY: "test-jwt-secret-key"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/testdb"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: microservices
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gateway database migrations
        working-directory: microservices/gateway_service
        run: |
          alembic upgrade head

      - name: Run Processing database migrations
        working-directory: microservices
        run: |
          alembic upgrade head

      - name: Start Processing Service
        working-directory: microservices
        run: |
          nohup python -m uvicorn processing_service.app.main:app --host 0.0.0.0 --port 8001 > processing.log 2>&1 &

      - name: Wait for Processing Service
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8001/health; then
              echo "Processing Service is ready"
              break
            fi
            echo "Waiting for Processing Service..."
            sleep 2
          done

      - name: Run Gateway tests
        working-directory: microservices
        run: |
          pytest -q gateway_service/tests

      - name: Run Processing tests
        working-directory: microservices
        run: |
          pytest -q processing_service/tests