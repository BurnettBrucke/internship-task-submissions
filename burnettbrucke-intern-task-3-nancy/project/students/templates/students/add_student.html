{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
    <h1>Add Student</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Student</button>
    </form>

    <p><a href="{% url 'student_list' %}">Back to Student List</a></p>
{% endblock %}
