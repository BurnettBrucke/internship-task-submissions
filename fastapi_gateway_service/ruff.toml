target-version = "py313"
line-length = 88

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

ignore = [
    "B008",
    "BLE001",
    "S110",
    "RUF012",
]

[lint.per-file-ignores]
"processing_service/alembic/versions/*.py" = ["F401"]
"gateway_service/tests/*.py" = ["E402"]
"processing_service/tests/*.py" = ["E402"]