services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microservices_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  processing:
    build:
      context: .
      dockerfile: processing_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/microservices_db
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_TOKEN: day8-internal-secret
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: processing_service/Dockerfile
    command: python -m arq processing_service.app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/microservices_db
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_TOKEN: day8-internal-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/microservices_db
      PROCESSING_BASE_URL: http://processing:8001
      INTERNAL_SERVICE_TOKEN: day8-internal-secret
      JWT_SECRET_KEY: day8-docker-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      processing:
        condition: service_started

volumes:
  postgres_data: