
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Management Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login Card */
        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);
        }

        /* Icon */
        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        /* Heading */
        .login-container h2 {
            text-align: center;
            color: #1e293b;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Form */
        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            color: #1e293b;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Error Messages */
        ul.errorlist {
            list-style: none;
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        /* Register Section */
        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            margin-left: 4px;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {

            .login-container {
                padding: 30px 22px;
            }

            .login-container h2 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Login Icon -->
        <div class="login-icon">
            🔐
        </div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to access the Student Management System
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </p>

    </div>

</body>

</html>
