<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Student Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* Register Card */
        .register-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        /* Icon */
        .icon {
            width: 65px;
            height: 65px;
            background: #eef0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        /* Heading */
        .register-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Form */
        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 6px rgba(102, 126, 234, 0.25);
        }

        /* Help Text */
        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
            line-height: 1.4;
        }

        /* Error Messages */
        ul.errorlist {
            color: #d9534f;
            font-size: 13px;
            margin-bottom: 8px;
            padding-left: 18px;
        }

        /* Register Button */
        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            color: #5568d9;
            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
            }

            .register-container {
                padding: 25px 20px;
            }

            .register-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="icon">👤</div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to access the Student Management System
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                🚀 Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</body>

</html>
