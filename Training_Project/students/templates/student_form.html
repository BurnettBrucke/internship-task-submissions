<!DOCTYPE html>
<html>

<head>

    <title>{{ title }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8f9fa);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        /* Header */

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        /* Form */

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .errorlist {
            color: #dc2626;
            font-size: 14px;
            margin: 5px 0;
            padding-left: 20px;
        }

        /* Buttons */

        .buttons {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .button {
            display: inline-block;
            padding: 11px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .submit {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
        }

        .back {
            background-color: #2563eb;
            color: white;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>🎓 {{ title }}</h1>

        <p>Enter student information below</p>

    </div>


    <!-- Student Form -->

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <!-- Buttons -->

        <div class="buttons">

            <button type="submit" class="button submit">

                ✓ Save Student

            </button>


            <a href="{% url 'student_list' %}"
               class="button back">

                ← Back to List

            </a>

        </div>

    </form>


</div>


</body>

</html>
