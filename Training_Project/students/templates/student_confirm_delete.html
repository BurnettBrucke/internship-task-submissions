<!DOCTYPE html>
<html>

<head>

    <title>Delete Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 50px 20px;
            background: linear-gradient(135deg, #fff1f2, #f8f9fa);
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #dc2626;
            margin: 10px 0 15px;
        }

        .message {
            color: #555;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .student-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            background-color: #f8f9ff;
            padding: 14px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .warning {
            color: #dc2626;
            background-color: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Buttons */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .delete {
            background-color: #dc2626;
            color: white;
        }

        .cancel {
            background-color: #2563eb;
            color: white;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .container {
                width: 95%;
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        ⚠️
    </div>


    <h1>Delete Student</h1>


    <p class="message">
        Are you sure you want to delete this student?
    </p>


    <div class="student-name">

        👤 {{ student.name }}

    </div>


    <div class="warning">

        ⚠️ This action cannot be undone.

    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="buttons">

            <button type="submit" class="button delete">

                🗑️ Yes, Delete

            </button>


            <a href="{% url 'student_detail' student.id %}"
               class="button cancel">

                ← Cancel

            </a>

        </div>

    </form>


</div>


</body>

</html>
